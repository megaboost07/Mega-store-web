<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Address</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    padding:20px;
    color:#111;
}

.container{
    max-width:600px;
    margin:auto;
    background:#fff;
    border-radius:14px;
    padding:20px;
    box-shadow:0 4px 20px rgba(0,0,0,.08);
}

h1{
    font-size:24px;
    margin-bottom:8px;
}

.description{
    color:#666;
    font-size:14px;
    margin-bottom:20px;
}

.location-btn{
    width:100%;
    padding:16px;
    border:1px solid #111;
    background:#111;
    color:#fff;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:20px;
}

.location-btn:active{
    transform:scale(.98);
}

.status{
    display:none;
    padding:12px;
    background:#f1f1f1;
    border-radius:8px;
    font-size:14px;
    margin-bottom:15px;
}

.location-box{
    display:none;
    background:#f7f7f7;
    border:1px solid #ddd;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
}

.location-box h3{
    margin-bottom:10px;
}

.location-data{
    font-size:14px;
    line-height:1.8;
    word-break:break-word;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin:15px 0 7px;
}

input, textarea, select{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#111;
}

textarea{
    min-height:90px;
    resize:vertical;
}

.save-btn{
    width:100%;
    padding:16px;
    margin-top:20px;
    border:none;
    background:#111;
    color:#fff;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.save-btn:active{
    transform:scale(.98);
}

.note{
    margin-top:15px;
    font-size:12px;
    color:#777;
    line-height:1.5;
}
</style>
</head>

<body>

<div class="container">

    <h1>Add Delivery Address</h1>

    <p class="description">
        Use your current location or enter your address manually.
    </p>

    <button class="location-btn" onclick="getLocation()">
        Use My Current Location
    </button>

    <div class="status" id="status"></div>

    <div class="location-box" id="locationBox">
        <h3>Your Current Location</h3>

        <div class="location-data">
            <strong>Latitude:</strong>
            <span id="latitude">-</span>
            <br>

            <strong>Longitude:</strong>
            <span id="longitude">-</span>

            <input type="hidden" id="latInput">
            <input type="hidden" id="lngInput">
        </div>
    </div>


    <form id="addressForm">

        <label>Full Name</label>
        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            required
        >

        <label>Mobile Number</label>
        <input
            type="tel"
            id="mobile"
            placeholder="Enter mobile number"
            required
        >

        <label>House No / Flat / Building</label>
        <input
            type="text"
            id="house"
            placeholder="House number, flat or building"
            required
        >

        <label>Area / Village / Locality</label>
        <input
            type="text"
            id="area"
            placeholder="Enter area or village"
            required
        >

        <label>City / District</label>
        <input
            type="text"
            id="city"
            placeholder="Enter city or district"
            required
        >

        <label>State</label>
        <input
            type="text"
            id="state"
            placeholder="Enter state"
            required
        >

        <label>PIN Code</label>
        <input
            type="number"
            id="pincode"
            placeholder="Enter PIN code"
            required
        >

        <label>Address Type</label>
        <select id="addressType">
            <option value="Home">Home</option>
            <option value="Work">Work</option>
            <option value="Other">Other</option>
        </select>

        <label>Landmark (Optional)</label>
        <textarea
            id="landmark"
            placeholder="Enter nearby landmark"
        ></textarea>

        <button type="submit" class="save-btn">
            Save Address
        </button>

    </form>

    <p class="note">
        Your browser will ask for location permission when you click
        "Use My Current Location".
    </p>

</div>


<script>

function getLocation(){

    const status = document.getElementById("status");

    if(!navigator.geolocation){

        status.style.display = "block";
        status.innerHTML =
            "Your browser does not support location detection.";

        return;
    }

    status.style.display = "block";
    status.innerHTML = "Getting your current location...";

    navigator.geolocation.getCurrentPosition(

        function(position){

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;

            document.getElementById("latitude")
                .innerText = latitude;

            document.getElementById("longitude")
                .innerText = longitude;

            document.getElementById("latInput")
                .value = latitude;

            document.getElementById("lngInput")
                .value = longitude;

            document.getElementById("locationBox")
                .style.display = "block";

            status.innerHTML =
                "Current location detected successfully.";

        },

        function(error){

            let message = "";

            switch(error.code){

                case error.PERMISSION_DENIED:
                    message =
                    "Location permission was denied.";
                    break;

                case error.POSITION_UNAVAILABLE:
                    message =
                    "Location information is unavailable.";
                    break;

                case error.TIMEOUT:
                    message =
                    "Location request timed out.";
                    break;

                default:
                    message =
                    "Unable to detect your location.";
            }

            status.innerHTML = message;

        },

        {
            enableHighAccuracy:true,
            timeout:10000,
            maximumAge:0
        }

    );

}


document.getElementById("addressForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    const addressData = {

        name:
        document.getElementById("name").value,

        mobile:
        document.getElementById("mobile").value,

        house:
        document.getElementById("house").value,

        area:
        document.getElementById("area").value,

        city:
        document.getElementById("city").value,

        state:
        document.getElementById("state").value,

        pincode:
        document.getElementById("pincode").value,

        addressType:
        document.getElementById("addressType").value,

        landmark:
        document.getElementById("landmark").value,

        latitude:
        document.getElementById("latInput").value,

        longitude:
        document.getElementById("lngInput").value

    };


    localStorage.setItem(
        "savedAddress",
        JSON.stringify(addressData)
    );


    alert("Address saved successfully!");

    console.log(addressData);

});

</script>

</body>
</html>
